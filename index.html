<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#6b4220">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ราคาไม้">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<title>คำนวณราคาไม้</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f1e9; --card:#fffdf9; --ink:#2b2118; --muted:#7a6a5a; --line:#e6dccd;
    --wood:#8a5a2b; --wood-d:#6b4220; --wood-l:#f1e4d2; --accent:#2f6b3f; --warn:#a4501b;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font-family:"Sarabun",system-ui,sans-serif;font-size:16px;line-height:1.35}
  header{padding:8px 12px 4px;max-width:900px;width:100%;margin:0 auto;display:flex;align-items:baseline;gap:8px}
  header h1{font-size:19px;margin:0;white-space:nowrap}
  header .f{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  main{padding:4px 10px calc(16px + env(safe-area-inset-bottom));display:grid;grid-template-columns:minmax(0,1fr);gap:8px;align-content:start;
       max-width:900px;width:100%;margin:0 auto}
  .card{min-width:0;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px}
  .card h2{font-size:14px;margin:0 0 6px;color:var(--wood-d)}

  /* ชนิดไม้ */
  .types{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
  .hrow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
  .hrow h2{margin:0}
  .seg{display:flex;background:var(--wood-l);border-radius:9px;padding:3px;margin-bottom:6px}
  .seg button{flex:1}
  .picker{width:100%;display:flex;align-items:center;gap:8px;font:inherit;color:inherit;background:#fff;border:1.5px solid var(--wood);border-radius:10px;padding:8px 12px;cursor:pointer;text-align:left}
  .picker .pk{flex:1;display:flex;align-items:baseline;justify-content:space-between;gap:8px;min-width:0}
  .picker b{font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .picker .arr{font-size:16px;color:var(--wood);transition:transform .25s}
  .picker[aria-expanded="true"] .arr{transform:rotate(180deg)}
  .drop{display:grid;grid-template-rows:0fr;transition:grid-template-rows .25s ease}
  .drop.open{grid-template-rows:1fr}
  .dropin{overflow:hidden;min-height:0}
  .drop.open .dropin{padding-top:8px}
  .seg button{font:inherit;font-size:14px;font-weight:600;border:0;background:none;color:var(--wood-d);padding:5px 12px;border-radius:7px;cursor:pointer}
  .seg button.on{background:var(--wood);color:#fff}
  .ty{font:inherit;color:inherit;background:#fff;border:1.5px solid var(--line);border-radius:9px;padding:6px 4px;cursor:pointer;text-align:center;line-height:1.2}
  .ty .n{font-size:13.5px;font-weight:600;display:block}
  .ty .p{font-size:15px;font-weight:700;color:var(--wood-d)}
  .ty .s{font-size:10px;color:var(--accent);font-weight:600;display:block;height:12px}
  .ty.on{background:var(--wood);border-color:var(--wood);color:#fff}
  .ty.on .p{color:#fff}.ty.on .s{color:#d6f0dc}
  .types.isother{grid-template-columns:minmax(0,1fr)}
  .ty.cw{position:relative;padding-right:26px;padding-left:26px}
  .ty .ed{position:absolute;top:50%;right:3px;transform:translateY(-50%);border:0;background:none;font-size:15px;color:var(--muted);padding:4px 6px;cursor:pointer}
  .ty.on .ed{color:#fff}
  .ty.addnew{border-style:dashed;color:var(--wood-d);background:transparent}
  .other .ot{font-weight:700;font-size:14px;color:var(--wood-d)}
  .other .acts{display:flex;gap:6px;flex-wrap:wrap}
  .other .acts .btn{flex:1;font-size:14px;padding:7px 8px;white-space:nowrap}
  .btn.ghost2{background:#fff;border:1.5px solid var(--line);color:var(--ink)}
  .btn.danger{background:#fff;border:1.5px solid #e2b9a2;color:var(--warn)}
  .btn.danger.arm{background:var(--warn);border-color:var(--warn);color:#fff}
  .other .ol{width:78px;flex:none;white-space:nowrap}
  .other{min-width:0;display:grid;grid-template-columns:minmax(0,1fr);gap:8px;background:#fff;border:1.5px solid var(--line);border-radius:9px;padding:10px}
  .other label{min-width:0;display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600}
  .other input{flex:1;min-width:0;font:inherit;font-size:16px;font-weight:600;padding:5px 8px;border:1.5px solid var(--line);border-radius:8px}
  .other input:focus{outline:0;border-color:var(--wood)}
  .other .oi{flex:1;min-width:0;display:flex;align-items:center;gap:6px;font-weight:400;color:var(--muted)}
  .other .oi input{text-align:right}
  .btn.opick{background:var(--wood);color:#fff}
  .tnote{font-size:12px;color:var(--warn);margin:6px 2px 0}
  .prow{display:flex;align-items:center;gap:6px;margin-top:8px;flex-wrap:wrap}
  .prow.under{border-top:1px dashed var(--line);padding-top:8px}
  .prow .l{font-size:13px;color:var(--muted)}
  .prow input{width:92px;font:inherit;font-weight:700;font-size:17px;padding:5px 8px;border:1.5px solid var(--line);border-radius:8px}
  .prow input:focus{outline:0;border-color:var(--wood)}
  .sbtn{font:inherit;font-size:13px;font-weight:600;border-radius:8px;padding:6px 10px;border:0;cursor:pointer}
  .sbtn.save{background:var(--accent);color:#fff}
  .sbtn.save:disabled{background:#d6cdbf;cursor:default}
  .sbtn.rst{background:none;border:1.5px solid var(--line);color:var(--ink)}
  .status{font-size:11px;color:var(--muted);width:100%;min-height:0}
  .status:empty{display:none}

  /* ขนาด */
  .fld{margin-bottom:8px}
  .fld:last-child{margin-bottom:0}
  .frow{display:flex;align-items:center;gap:8px}
  .frow label{font-weight:600;font-size:15px;width:44px;flex:none}
  .inp{flex:1;display:flex;align-items:center;border:1.5px solid var(--line);border-radius:9px;background:#fff;min-width:0}
  .inp:focus-within{border-color:var(--wood)}
  .inp input{flex:1;min-width:0;border:0;outline:0;font:inherit;font-size:19px;font-weight:700;padding:5px 8px;background:transparent}
  .inp span{padding:0 4px;color:var(--muted);font-size:13px}
  .clr{border:0;background:none;color:var(--muted);font-size:18px;padding:0 8px;cursor:pointer}
  .chips{display:flex;gap:5px;overflow-x:auto;margin:5px 0 0 52px;padding-bottom:2px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;font:inherit;font-size:13px;font-weight:600;min-width:36px;padding:3px 7px;border-radius:6px;border:1.5px solid var(--line);background:#fff;color:var(--ink);cursor:pointer}
  .chip:active{transform:scale(.95)}
  .chip.on{background:var(--wood);border-color:var(--wood);color:#fff}
  .two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
  .two .frow label{width:auto}
  .two .inp input{font-size:18px;padding:5px 6px}
  input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
  input[type=number]{-moz-appearance:textfield}

  /* ผลลัพธ์ใต้กล่องขนาด */
  .res{margin-top:10px;background:var(--wood-d);color:#fff;border-radius:10px;padding:10px 12px;scroll-margin-bottom:12px}
  .res .top{display:flex;align-items:flex-end;justify-content:space-between;gap:8px}
  .res .big{font-size:28px;font-weight:700;line-height:1}
  .res .per{font-size:13px;opacity:.9;text-align:right}
  .res .formula{font-size:12px;opacity:.85;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .res .btns{display:flex;gap:6px;margin-top:8px}
  .btn{font:inherit;font-weight:600;font-size:15px;border-radius:9px;padding:8px 10px;border:0;cursor:pointer}
  .btn.pri{background:#fff;color:var(--wood-d);flex:1}
  .btn.sec{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.45)}
  .badge{display:inline-block;min-width:20px;padding:0 6px;border-radius:10px;background:#fff;color:var(--wood-d);font-size:12px;margin-left:4px}

  /* เมนูแก้ไขราคา */
  .editbtn{font:inherit;font-size:13px;font-weight:600;background:none;border:1.5px solid var(--line);color:var(--muted);border-radius:8px;padding:3px 9px;cursor:pointer}
  .editbtn.on{border-color:var(--wood);color:var(--wood-d);background:var(--wood-l)}
  .edbox{margin-top:8px;border:1.5px dashed var(--line);border-radius:10px;padding:8px 10px}
  .edrow{display:flex;align-items:center;gap:8px;padding:4px 0;border-bottom:1px solid var(--line)}
  .edrow:last-of-type{border-bottom:0}
  .edrow span{flex:1;font-size:14px;min-width:0}
  .edrow small{display:block;font-size:11px;color:var(--muted)}
  .edrow input{width:90px;font:inherit;font-weight:700;font-size:16px;padding:4px 8px;border:1.5px solid var(--line);border-radius:8px;text-align:right}
  .edrow input:focus{outline:0;border-color:var(--wood)}
  .edrow input.chg{border-color:var(--accent);background:#eef6ef}
  .edact{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px}

  /* แผ่นรายการ */
  .sheet{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:flex-end;justify-content:center;z-index:10}
  .sheet.open{display:flex}
  .panel{background:var(--card);width:100%;max-width:640px;max-height:80dvh;border-radius:16px 16px 0 0;display:flex;flex-direction:column}
  .panel .hd{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--line)}
  .panel .hd b{font-size:17px}
  .panel .bd{overflow-y:auto;padding:4px 14px}
  .panel .ft{padding:10px 14px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
  .x{border:0;background:none;font-size:22px;cursor:pointer;color:var(--muted)}
  table{width:100%;border-collapse:collapse;font-size:14px}
  td{padding:7px 4px;border-bottom:1px solid var(--line);vertical-align:top}
  td.num{text-align:right;white-space:nowrap}
  .del{border:0;background:none;color:var(--warn);font-size:16px;cursor:pointer}
  .total{display:flex;justify-content:space-between;font-size:19px;font-weight:700;margin-bottom:8px}
  .empty{color:var(--muted);font-size:14px;padding:16px 0;text-align:center}
  .ftb{display:flex;gap:8px}
  .ftb .btn{flex:1;border:1.5px solid var(--line);background:#fff;color:var(--ink)}
  .toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 14px;border-radius:9px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
  .toast.show{opacity:1}

  @media (min-width:760px){
    main{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}
  }
  @media (max-height:640px){
    .chips{margin-top:3px}
    .chip{padding:3px 6px;font-size:12.5px}
  }
</style>
</head>
<body>
<header>
  <h1>🪵 คำนวณราคาไม้</h1>
  <span class="f">หนา × กว้าง × ยาว(ม.) × 0.0228 × ราคาต่อคิว</span>
</header>

<main>
  <section class="card">
    <div class="hrow"><h2>1. ชนิดไม้</h2><button class="editbtn" id="editBtn">✏️ แก้ไขราคา</button></div>
    <button class="picker" id="picker" aria-expanded="false">
      <span class="pk"><b id="pkName"></b></span><span class="arr">▾</span>
    </button>
    <div class="drop" id="drop">
      <div class="dropin">
        <div class="seg" id="seg"><button data-g="yang">ไม้ยาง</button><button data-g="teng">ไม้เต็ง</button><button data-g="other">อื่นๆ</button></div>
        <div class="types" id="types"></div>
      </div>
    </div>
    <div class="tnote" id="tnote"></div>
    <div class="drop" id="edit">
      <div class="dropin">
        <div class="edbox">
          <div style="font-size:13px;font-weight:600;color:var(--wood-d);margin-bottom:4px">ราคาต่อคิว (บาท)</div>
          <div id="edRows"></div>
          <div class="edact">
            <button class="sbtn save" id="savePrice" disabled>💾 บันทึก</button>
            <button class="sbtn rst" id="resetPrice">คืนราคาเดิมทั้งหมด</button>
            <span class="status" id="saveStatus"></span>
          </div>
        </div>
      </div>
    </div>
  </section>

  <section class="card">
    <h2>2. ขนาด</h2>
    <div id="fields"></div>
    <div class="res" id="res">
      <div class="top">
        <div class="big" id="total">0 บาท</div>
        <div class="per">ต่อแผ่น <b id="per">0</b> บาท</div>
      </div>
      <div class="formula" id="formula">กรอกขนาดไม้เพื่อคำนวณ</div>
      <div class="btns">
        <button class="btn pri" id="add">+ เพิ่มลงรายการ</button>
        <button class="btn sec" id="openList">รายการ<span class="badge" id="cnt">0</span></button>
        <button class="btn sec" id="reset">ล้าง</button>
      </div>
    </div>
  </section>
</main>

<div class="sheet" id="sheet">
  <div class="panel">
    <div class="hd"><b>รายการที่เพิ่มไว้</b><button class="x" id="closeList">✕</button></div>
    <div class="bd" id="list"></div>
    <div class="ft" id="listFt">
      <div class="total"><span>รวมทั้งหมด</span><span id="sum">0 บาท</span></div>
      <div class="ftb">
        <button class="btn" id="copy">คัดลอกรายการ</button>
        <button class="btn" id="clearList">ล้างทั้งหมด</button>
      </div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const K = 0.0228;
const TYPES = [
  {g:"yang", id:"yang1", short:"ยาง ไม่ใส",   name:"ไม้ยาง ไม่ใส", note:"กอง: ประตูเลื่อน โซนใน · มีแค่ 1.5 นิ้ว และ 3 นิ้ว", price:550},
  {g:"yang", id:"yang2", short:"ยาง ใส",      name:"ไม้ยาง ใส", note:"กอง: ข้างล่างโซนร้าน · มีแค่ 1.5 นิ้ว และ 3 นิ้ว", price:630},
  {g:"teng", id:"teng1", short:"เต็ง ปานกลาง", name:"ไม้เต็ง คุณภาพปานกลาง", note:"กอง: ด้านหน้า · มีขนาดยาว/แผ่นใหญ่ หนาไม่เกิน 5 นิ้ว", price:650},
  {g:"teng", id:"teng2", short:"เต็งดี 5–8″",  name:"ไม้เต็ง อย่างดี กว้าง 5–8 นิ้ว", note:"กอง: ด้านใน · มีขนาดยาว/แผ่นใหญ่ กว้าง 5–8 นิ้ว", price:1500},
  {g:"teng", id:"teng3", short:"เต็งดี 10″",   name:"ไม้เต็ง อย่างดี กว้าง 10 นิ้ว", note:"กอง: ด้านใน · มีขนาดยาว/แผ่นใหญ่ กว้าง 10 นิ้ว", price:1600},
  {g:"teng", id:"teng4", short:"เต็งดี 11″",   name:"ไม้เต็ง อย่างดี กว้าง 11 นิ้ว", note:"กอง: ด้านใน · มีขนาดยาว/แผ่นใหญ่ กว้าง 11 นิ้ว", price:1700},
];
const FIELDS = [
  {key:"t", label:"หนา", unit:"นิ้ว", chips:[0.5,1,1.5,2,2.5,3,4,5]},
  {key:"w", label:"กว้าง", unit:"นิ้ว", chips:[1.5,2,3,4,5,6,8,10,11,12]},
  {key:"l", label:"ยาว", unit:"ม."},
  {key:"q", label:"จำนวน", unit:"แผ่น"},
];

let sel = TYPES[0].id;
let viewG = TYPES[0].g;
const vals = {t:"", w:"", l:"", q:"1"};
let items = [];
let saved = {};
const LS_KEY = "woodcalc.prices";

const $ = id => document.getElementById(id);
const fmt = (n,d=2) => Number(n).toLocaleString("th-TH",{minimumFractionDigits:0,maximumFractionDigits:d});
const OTHER_NAME = "ไม้อื่นๆ";
const DEFAULT_CUSTOMS = [{id:"c_red", name:"ไม้แดง", price:2500}];
const LS_CUS = "woodcalc.customs";
let customs = DEFAULT_CUSTOMS.map(x=>({...x}));
let oForm = null;      // null | {mode:"add"} | {mode:"edit", id}
let delArm = false;
const esc = t => String(t).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function cleanCustoms(list){
  if(!Array.isArray(list)) return null;
  return list.filter(x=>x && typeof x.id==="string" && /^c_[\w-]+$/.test(x.id) && typeof x.price==="number" && x.price>0)
             .map(x=>({id:x.id, name:String(x.name||OTHER_NAME).slice(0,60), price:x.price}));
}
function typeOf(id){
  const c=customs.find(x=>x.id===id);
  if(c) return {g:"other", id:c.id, short:c.name, name:c.name, note:"ไม้อื่นๆ (เพิ่มเอง)", price:c.price};
  return TYPES.find(x=>x.id===id) || TYPES[0];
}
function frac(v){
  const w=Math.floor(v), r=Math.round((v-w)*100)/100;
  const m={0.25:"¼",0.5:"½",0.75:"¾"};
  return m[r] ? (w?w:"")+m[r] : String(v);
}
function getPrice(id){
  const c=customs.find(x=>x.id===id); if(c) return c.price;
  const v=saved[id]; return (typeof v==="number" && v>0) ? v : typeOf(id).price;
}

function renderOtherForm(box){
  const isEdit = oForm.mode==="edit";
  const c = isEdit ? customs.find(x=>x.id===oForm.id) : null;
  box.innerHTML=`<div class="other">
    <div class="ot">${isEdit?"แก้ไขไม้":"เพิ่มไม้ใหม่"}</div>
    <label><span class="ol">ชื่อไม้</span><input id="oName" type="text" maxlength="60"></label>
    <label><span class="ol">ราคาต่อคิว</span><span class="oi"><input id="oPrice" type="number" inputmode="decimal" placeholder="0"> บาท</span></label>
    <div class="acts">
      ${isEdit
        ? `<button class="btn opick" id="oSave">💾 บันทึก</button><button class="btn danger" id="oDel">🗑 ลบ</button>`
        : `<button class="btn opick" id="oSave">✓ เพิ่มและใช้ไม้นี้</button>`}
      <button class="btn ghost2" id="oCancel">ยกเลิก</button>
    </div>
  </div>`;
  $("oName").value = c ? c.name : OTHER_NAME;
  $("oPrice").value = c ? c.price : "";
  delArm=false;
  $("oCancel").onclick=()=>{ oForm=null; renderTypes(); };
  $("oSave").onclick=()=>{
    const price=parseFloat($("oPrice").value);
    if(!(price>0)){ toast("กรุณาใส่ราคาต่อคิว"); $("oPrice").focus(); return; }
    const name=$("oName").value.trim()||OTHER_NAME;
    if(isEdit){
      customs=customs.map(x=>x.id===c.id?{...x,name,price}:x);
      toast("แก้ไขแล้ว");
      oForm=null; renderTypes(); calc();
    }else{
      const id="c_"+Date.now().toString(36);
      customs=[...customs,{id,name,price}];
      sel=id; oForm=null; renderTypes(); calc(); toggleDrop(false);
      toast(`เพิ่ม "${name}" แล้ว`);
    }
    persistCustoms();
  };
  if(isEdit) $("oDel").onclick=()=>{
    if(!delArm){ delArm=true; $("oDel").classList.add("arm"); $("oDel").textContent="กดอีกครั้งเพื่อลบ"; return; }
    customs=customs.filter(x=>x.id!==c.id);
    if(sel===c.id) sel=TYPES[0].id;
    oForm=null; renderTypes(); calc(); persistCustoms(); toast("ลบแล้ว");
  };
}

function renderTypes(){
  const box=$("types"); box.innerHTML="";
  const g=viewG;
  document.querySelectorAll("#seg button").forEach(b=>b.classList.toggle("on",b.dataset.g===g));
  box.classList.toggle("isother", g==="other" && !!oForm);
  if(g==="other"){
    if(oForm){ renderOtherForm(box); refreshSel(); return; }
    customs.forEach(c=>{
      const d=document.createElement("div");
      d.className="ty cw"+(c.id===sel?" on":""); d.setAttribute("role","button"); d.tabIndex=0;
      d.innerHTML=`<span class="n">${esc(c.name)}</span><button class="ed" title="แก้ไข / ลบ">✎</button>`;
      d.onclick=()=>{ sel=c.id; renderTypes(); calc(); toggleDrop(false); };
      d.querySelector(".ed").onclick=e=>{ e.stopPropagation(); oForm={mode:"edit",id:c.id}; renderTypes(); };
      box.appendChild(d);
    });
    const a=document.createElement("button");
    a.className="ty addnew"; a.innerHTML='<span class="n">+ เพิ่มไม้ใหม่</span>';
    a.onclick=()=>{ oForm={mode:"add"}; renderTypes(); };
    box.appendChild(a);
  }
  TYPES.filter(t=>t.g===g).forEach(t=>{
    const b=document.createElement("button");
    b.className="ty"+(t.id===sel?" on":"");
    b.innerHTML=`<span class="n">${t.short}</span>`;
    b.onclick=()=>{ sel=t.id; renderTypes(); calc(); toggleDrop(false); };
    box.appendChild(b);
  });
  refreshSel();
}
async function persistCustoms(){
  try{ localStorage.setItem(LS_CUS, JSON.stringify(customs)); }catch(e){}
}
function applyCustoms(list){
  const c=cleanCustoms(list); if(!c) return;
  customs=c;
  if(sel.startsWith("c_") && !customs.find(x=>x.id===sel)) sel=TYPES[0].id;
  if(!oForm) renderTypes(); else refreshSel();
  calc();
}
function refreshSel(){
  $("tnote").textContent = typeOf(sel).note;
  $("pkName").textContent = typeOf(sel).name;
}
function toggleDrop(open){
  if(open===undefined) open=!$("drop").classList.contains("open");
  if(open){ viewG=typeOf(sel).g; oForm=null; renderTypes(); }
  $("drop").classList.toggle("open",open);
  $("picker").setAttribute("aria-expanded",open);
}

function fieldHTML(f){
  return `<div class="frow"><label for="f_${f.key}">${f.label}</label>
    <div class="inp"><input id="f_${f.key}" type="number" inputmode="decimal" step="any" min="0" placeholder="0"><span>${f.unit}</span><button class="clr" tabindex="-1">×</button></div></div>`;
}
function bindField(d,f){
  const inp=d.querySelector("input"); inp.value=vals[f.key];
  inp.oninput=()=>{ vals[f.key]=inp.value; markChips(); calc(); };
  inp.addEventListener("focus",showResult);
  d.querySelector(".clr").onclick=()=>{ vals[f.key]=""; inp.value=""; markChips(); calc(); inp.focus(); };
  if(f.chips){
    const c=document.createElement("div"); c.className="chips";
    f.chips.forEach(v=>{
      const b=document.createElement("button"); b.className="chip"; b.textContent=frac(v)+'"'; b.dataset.k=f.key; b.dataset.v=v;
      b.onclick=()=>{ vals[f.key]=String(v); inp.value=v; markChips(); calc(); };
      c.appendChild(b);
    });
    d.appendChild(c);
  }
}
function renderFields(){
  const box=$("fields"); box.innerHTML="";
  FIELDS.filter(f=>f.chips).forEach(f=>{
    const d=document.createElement("div"); d.className="fld"; d.innerHTML=fieldHTML(f); bindField(d,f); box.appendChild(d);
  });
  const two=document.createElement("div"); two.className="two fld";
  FIELDS.filter(f=>!f.chips).forEach(f=>{
    const d=document.createElement("div"); d.innerHTML=fieldHTML(f); bindField(d,f); two.appendChild(d);
  });
  box.appendChild(two);
  markChips();
}
function markChips(){
  document.querySelectorAll(".chip").forEach(b=>{
    b.classList.toggle("on", vals[b.dataset.k]!=="" && Number(vals[b.dataset.k])===Number(b.dataset.v));
  });
}

function current(){
  const t=parseFloat(vals.t), w=parseFloat(vals.w), l=parseFloat(vals.l);
  const q=parseFloat(vals.q)||1, p=getPrice(sel), type=typeOf(sel);
  if(!(t>0&&w>0&&l>0&&p>0)) return {ok:false};
  const per=t*w*l*K*p;
  return {ok:true,t,w,l,q,p,type,per,total:per*q};
}
function calc(){
  const c=current();
  if(!c.ok){ $("total").textContent="0 บาท"; $("per").textContent="0"; $("formula").textContent="กรอก หนา กว้าง ยาว เพื่อคำนวณ"; return; }
  $("total").textContent=fmt(c.total)+" บาท";
  $("per").textContent=fmt(c.per);
  $("formula").textContent=`${c.type.short} · ${frac(c.t)}" × ${frac(c.w)}" × ${fmt(c.l)} ม.`+(c.q!==1?` × ${fmt(c.q)} แผ่น`:"");
}

function renderList(){
  $("cnt").textContent=items.length;
  const box=$("list");
  if(!items.length){ box.innerHTML='<div class="empty">ยังไม่มีรายการ</div>'; $("listFt").style.display="none"; return; }
  $("listFt").style.display="";
  let sum=0, h='<table>';
  items.forEach((it,i)=>{
    sum+=it.total;
    h+=`<tr><td>${i+1}.</td><td>${it.name}<br><span style="color:var(--muted);font-size:12px">${frac(it.t)}″ × ${frac(it.w)}″ × ${fmt(it.l)} ม. × ${fmt(it.q)} แผ่น</span></td>
      <td class="num">${fmt(it.total)}</td><td><button class="del" data-i="${i}">✕</button></td></tr>`;
  });
  box.innerHTML=h+'</table>';
  $("sum").textContent=fmt(sum)+" บาท";
  box.querySelectorAll(".del").forEach(b=>b.onclick=()=>{items.splice(+b.dataset.i,1);renderList();});
}

function toast(m){ const t=$("toast"); t.textContent=m; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),1500); }

$("add").onclick=()=>{
  const c=current();
  if(!c.ok){ toast("กรุณากรอก หนา กว้าง ยาว ให้ครบ"); return; }
  items.push({name:c.type.name,t:c.t,w:c.w,l:c.l,q:c.q,p:c.p,total:c.total});
  renderList(); toast(`เพิ่มแล้ว (${items.length} รายการ)`);
};
$("reset").onclick=()=>{ vals.t="";vals.w="";vals.l="";vals.q="1"; renderFields(); calc(); };
$("openList").onclick=()=>$("sheet").classList.add("open");
$("closeList").onclick=()=>$("sheet").classList.remove("open");
$("sheet").onclick=e=>{ if(e.target.id==="sheet") $("sheet").classList.remove("open"); };
$("clearList").onclick=()=>{ items=[]; renderList(); };
$("copy").onclick=async()=>{
  let sum=0;
  const lines=items.map((it,i)=>{sum+=it.total;return `${i+1}. ${it.name} ${frac(it.t)}"x${frac(it.w)}" ยาว ${fmt(it.l)} ม. x ${fmt(it.q)} แผ่น = ${fmt(it.total)} บาท`;});
  lines.push(`รวม ${fmt(sum)} บาท`);
  try{ await navigator.clipboard.writeText(lines.join("\n")); toast("คัดลอกแล้ว"); }
  catch(e){ toast("คัดลอกไม่ได้ในเบราว์เซอร์นี้"); }
};

document.querySelectorAll("#seg button").forEach(b=>b.onclick=()=>{ viewG=b.dataset.g; oForm=null; renderTypes(); });
$("picker").onclick=()=>toggleDrop();
// เลื่อนให้เห็นราคารวม เวลาแป้นพิมพ์มือถือขึ้นมา
function showResult(){
  setTimeout(()=>{
    const r=$("res").getBoundingClientRect();
    const vh=(window.visualViewport?window.visualViewport.height:window.innerHeight);
    if(r.bottom>vh) $("res").scrollIntoView({block:"end",behavior:"smooth"});
  },350);
}

/* ---------- ราคาเริ่มต้นที่บันทึกไว้ ---------- */
function setStatus(m){ $("saveStatus").textContent=m; }
function renderEdit(){
  $("edRows").innerHTML = TYPES.map(t=>`<label class="edrow"><span>${t.name}<small>ราคาเดิม ${fmt(t.price)}</small></span><input type="number" inputmode="decimal" data-id="${t.id}" value="${getPrice(t.id)}"></label>`).join("");
  $("edRows").querySelectorAll("input").forEach(i=>i.oninput=()=>{ updateEdit(); setStatus(""); });
  updateEdit();
}
function editVals(){
  const o={}; $("edRows").querySelectorAll("input").forEach(i=>o[i.dataset.id]=parseFloat(i.value)); return o;
}
function updateEdit(){
  const v=editVals(); let changed=false, bad=false;
  $("edRows").querySelectorAll("input").forEach(i=>{
    const x=v[i.dataset.id]; const c=x!==getPrice(i.dataset.id);
    i.classList.toggle("chg",c); if(c) changed=true; if(!(x>0)) bad=true;
  });
  $("savePrice").disabled = !changed || bad;
  $("resetPrice").style.display = Object.keys(saved).length ? "" : "none";
}
function toggleEdit(open){
  if(open===undefined) open=!$("edit").classList.contains("open");
  if(open){ renderEdit(); setStatus(""); }
  $("edit").classList.toggle("open",open);
  $("editBtn").classList.toggle("on",open);
}
$("editBtn").onclick=()=>toggleEdit();
function applySaved(obj){
  const clean={};
  if(obj && typeof obj==="object") for(const t of TYPES){ if(typeof obj[t.id]==="number" && obj[t.id]>0) clean[t.id]=obj[t.id]; }
  saved=clean;
  renderTypes(); calc();
  if(!$("edit").classList.contains("open")) renderEdit(); else updateEdit();
}
async function persist(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(saved)); }catch(e){}
  return "บันทึกไว้ในเครื่องนี้แล้ว";
}
$("savePrice").onclick=async()=>{
  const v=editVals(), n={};
  for(const t of TYPES){ const x=v[t.id]; if(x>0 && x!==t.price) n[t.id]=x; }
  saved=n;
  $("savePrice").disabled=true; setStatus("กำลังบันทึก…");
  renderTypes(); calc(); renderEdit();
  setStatus(await persist()); toast("บันทึกราคาแล้ว");
};
$("resetPrice").onclick=async()=>{
  saved={}; renderTypes(); calc(); renderEdit();
  setStatus("กำลังบันทึก…"); setStatus(await persist()); toast("คืนราคาเดิมแล้ว");
};

try{ const ls=JSON.parse(localStorage.getItem(LS_KEY)||"null"); if(ls) saved=ls; }catch(e){}
try{ const lc=cleanCustoms(JSON.parse(localStorage.getItem(LS_CUS)||"null")); if(lc) customs=lc; }catch(e){}
renderTypes(); renderFields(); renderList(); calc(); renderEdit();

if("serviceWorker" in navigator){
  window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
</script>
</body>
</html>
